name: Idea
description: Suggest something Kill Cord should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or question you had, in your own words. "I want to know when a staging key starts spending" is more useful than a feature name.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like Kill Cord to handle it, if you have an idea. For a new provider, link its official billing or usage API docs.
