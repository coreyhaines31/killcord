name: Spikes

# Kill Cord Teams unit 0 (docs/product/spikes/2026-11-unit-0.md): builds the spike worker on Linux and runs
# it against a throwaway Postgres. Nothing here ships. Fake keys and throwaway passwords only.
on:
  pull_request:
    paths:
      - "spikes/**"
      - "Packages/KillCordCore/**"
      - ".github/workflows/spikes.yml"
  workflow_dispatch:

jobs:
  teams-worker:
    name: Teams worker spike (Linux + Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: spike-only-not-real
          POSTGRES_DB: kc_spike
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: spike-only-not-real
      PGDATABASE: kc_spike
      KC_SPIKE_PGHOST: localhost
      KC_SPIKE_OWNER: postgres
      KC_SPIKE_OWNER_PASSWORD: spike-only-not-real
    steps:
      - uses: actions/checkout@v4

      - name: Roles and row-level security
        run: spikes/teams-worker/sql/check-roles.sh

      # The dependency graph needs Swift 6.4 tools (swift-collections 1.7.6), newer than setup-swift offers, so build in the official
      # image, on the host network so it reaches the Postgres service.
      - name: Build, test, and run the worker (Swift 6.4, Linux)
        run: |
          docker run --rm --network host -v "$PWD:/repo" -w /repo/spikes/teams-worker \
            -e KC_SPIKE_PGHOST -e KC_SPIKE_OWNER -e KC_SPIKE_OWNER_PASSWORD \
            swift:6.4.2-noble \
            bash -c "swift --version && swift build && swift test && swift run killcord-worker-spike"
