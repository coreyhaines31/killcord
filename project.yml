name: KillCord
options:
  bundleIdPrefix: app.killcord
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: KPQU8X839X
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
packages:
  KillCordCore:
    path: Packages/KillCordCore
  PanelKit:
    url: https://github.com/coreyhaines31/panelkit
    exactVersion: "0.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  KillCord:
    type: application
    platform: macOS
    sources:
      - KillCord
    dependencies:
      - package: KillCordCore
      - package: Sparkle
      - package: PanelKit
    info:
      path: KillCord/Info.plist
      properties:
        CFBundleDisplayName: Kill Cord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 Corey Haines. FSL-1.1-MIT.
        SUFeedURL: https://github.com/coreyhaines31/killcord/releases/latest/download/appcast.xml
        # PLACEHOLDER: replace with the real Sparkle EdDSA public key before the first release
        # (generate_keys --account killcord). Sparkle rejects updates signed with any other key.
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_ED_KEY_BEFORE_RELEASE
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: Kill Cord
        PRODUCT_MODULE_NAME: KillCord
        PRODUCT_BUNDLE_IDENTIFIER: app.killcord.KillCord
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  KillCord:
    build:
      targets:
        KillCord: all
    test:
      targets:
        - package: KillCordCore/KillCordCoreTests
