name: KillCord
options:
  bundleIdPrefix: app.killcord
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: KPQU8X839X
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ARCHS: "arm64 x86_64"
packages:
  KillCordCore:
    path: Packages/KillCordCore
  PanelKit:
    url: https://github.com/coreyhaines31/panelkit
    exactVersion: "0.2.1"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  KillCord:
    type: application
    platform: macOS
    sources:
      - KillCord
    dependencies:
      - package: KillCordCore
      - package: Sparkle
      - package: PanelKit
    info:
      path: KillCord/Info.plist
      properties:
        CFBundleDisplayName: Kill Cord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 Corey Haines. FSL-1.1-MIT.
        SUFeedURL: https://github.com/coreyhaines31/killcord/releases/latest/download/appcast.xml
        # Private key stays in the login Keychain under the killcord account.
        SUPublicEDKey: sBmJKONk2QDdL3IGMxCTG5099eDwWX1TYC4F7ENyfq4=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: Kill Cord
        PRODUCT_MODULE_NAME: KillCord
        PRODUCT_BUNDLE_IDENTIFIER: app.killcord.KillCord
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Offscreen tests for the Settings sidebar, provider marks, and renders of the Providers pane and the panel on sample
  # data. Unhosted: it compiles the views itself and never launches the app. Preferences go to a throwaway defaults
  # suite and the spend cache to a temporary folder.
  KillCordSettingsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - KillCord/Settings/SidebarPicker.swift
      - KillCord/Settings/SettingsComponents.swift
      - KillCord/Settings/SettingsTab.swift
      - KillCord/Settings/ProvidersSettingsView.swift
      - KillCord/Settings/ProviderEditor.swift
      - KillCord/Settings/ProviderEditor+Labels.swift
      - KillCord/Settings/ProviderDetailParts.swift
      - KillCord/Model/SpendModel.swift
      - KillCord/Model/SpendModel+Connections.swift
      - KillCord/App/Preferences.swift
      - KillCord/Panel/PanelView.swift
      - KillCord/Panel/ProviderCard.swift
      - KillCord/Assets.xcassets
      - KillCordSettingsTests
    dependencies:
      - package: KillCordCore
      - package: PanelKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KillCord:
    build:
      targets:
        KillCord: all
    test:
      targets:
        - package: KillCordCore/KillCordCoreTests
        - KillCordSettingsTests
